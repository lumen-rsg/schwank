name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            command: desktop:dist:mac
            artifact: schwank-macos-arm64
          - name: Linux x64
            os: ubuntu-24.04
            command: desktop:dist:linux
            artifact: schwank-linux-x64
          - name: Windows x64
            os: windows-2025
            command: desktop:dist:windows
            artifact: schwank-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run desktop:check
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.AppImage
            release/desktop/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: schwank-*
          path: release/desktop
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="docs/releases/$version.md"
          if [ -f "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" release/desktop/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "schwank $version" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" release/desktop/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "schwank $version" \
              --generate-notes
          fi
